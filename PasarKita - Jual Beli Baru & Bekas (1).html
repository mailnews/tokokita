<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PasarKita - Jual Beli Baru & Bekas</title>
<style>
:root{--bg:#0d0f13;--card:#171a21;--line:#262a33;--text:#f2f2f2;--muted:#9aa0ab;--o:#ff6a1a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top,0px)}
header{position:sticky;top:0;z-index:10;background:#0a0c10;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 20px}
.logo{font-weight:800;font-size:20px;cursor:pointer}.logo span{color:var(--o)}
nav a{color:var(--muted);font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav a.on,nav a:hover{color:var(--o)}
.grow{flex:1}
.btn{background:var(--o);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:7px 12px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:20px}
input,select,textarea{width:100%;background:#0e1117;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;margin:4px 0 12px;font-family:inherit}
label{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hero{background:linear-gradient(120deg,#0a0c10,#1c2029);border:1px solid var(--line);border-radius:14px;padding:26px}
.hero h1{margin:0 0 6px;font-size:clamp(26px,4vw,40px);text-transform:uppercase}
.hero h1 span{color:var(--o)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:20px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 6px;text-align:center;font-size:13px;cursor:pointer}
.tile.on{border-color:var(--o);color:var(--o)}
.ti{font-size:26px;margin-bottom:4px}
.pic img,.pic .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph{display:grid;place-items:center;font-size:44px;background:#21252d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.item{cursor:pointer}
.body{padding:12px}
.price{color:var(--o);font-weight:700;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;background:#262a33;margin-right:4px}
.tag.new{background:var(--o);color:#fff}
.row{display:flex;gap:8px;align-items:center}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.msgs{height:55vh;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:75%;padding:8px 12px;border-radius:12px;background:#262a33;font-size:14px;word-wrap:break-word;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--o)}
.bub img{max-width:100%;border-radius:8px;display:block}
.err{color:#ff6b6b;font-size:13px;min-height:18px}
.tabbar{display:none}
.box{max-width:460px;margin:30px auto;padding:24px}
@media (max-width:760px){
 header{padding:10px 14px}
 .top,.who{display:none}
 main{padding:14px 14px 90px}
 .hero{padding:20px}
 .tiles{gap:6px}
 .tile{font-size:11px;padding:10px 2px}
 .ti{font-size:20px}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .layout{grid-template-columns:1fr}
 .bub{max-width:88%}
 .msgs{height:58vh}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0a0c10;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
 .tabbar a{color:var(--muted);font-size:12px;cursor:pointer;padding:4px 6px}
 .tabbar a.on{color:var(--o)}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<script>
const $=s=>document.querySelector(s);
const K={u:'pk_users',s:'pk_session',i:'pk_items',c:'pk_chats',f:'pk_fav'};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('Penyimpanan penuh. Gunakan foto yang lebih kecil.');return false}};
const uid=()=>Math.random().toString(36).slice(2,10);
const CATS=['Otomotif','Gadget','Pakaian','Kosmetik','Rumah Tangga','Furnitur','Hobi & Olahraga','Buku & Alat Tulis','Mainan & Bayi','Hewan Peliharaan'];
const EMO={Otomotif:'🚗',Gadget:'📱',Pakaian:'👕',Kosmetik:'💄','Rumah Tangga':'🏠',Furnitur:'🛋️','Hobi & Olahraga':'⚽','Buku & Alat Tulis':'📚','Mainan & Bayi':'🧸','Hewan Peliharaan':'🐾'};
const CITIES={'Banjarmasin':[-3.3186,114.5944],'Banjarbaru':[-3.4420,114.8320],'Martapura':[-3.4069,114.8483],'Jakarta':[-6.2088,106.8456],'Surabaya':[-7.2575,112.7521],'Bandung':[-6.9175,107.6191],'Semarang':[-6.9667,110.4167],'Yogyakarta':[-7.7956,110.3695],'Medan':[3.5952,98.6722],'Makassar':[-5.1477,119.4327]};
let S={view:'home',cat:'Semua',cond:'',sort:'dist',q:'',loc:null,city:'Banjarmasin',id:null,rad:'',pmin:'',pmax:''};

S.q=load('pk_lastq','')||'';
const me=()=>load(K.u,[]).find(u=>u.id===load(K.s,null))||null;
const dist=(a,b)=>{const R=6371,r=x=>x*Math.PI/180;const d1=r(b[0]-a[0]),d2=r(b[1]-a[1]);const h=Math.sin(d1/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const go=(v,id)=>{S.view=v;S.id=id??null;render();window.scrollTo(0,0)};
const pic=i=>((i.photos&&i.photos[0])||i.photo)?`<img src="${(i.photos&&i.photos[0])||i.photo}" alt="">`:`<div class="ph">${EMO[i.cat]||'📦'}</div>`;
const citySelect=(id,val)=>`<select id="${id}">${Object.keys(CITIES).map(c=>`<option ${c===val?'selected':''}>${c}</option>`).join('')}</select>`;

function shrink(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.75))};im.src=r.result};
  r.readAsDataURL(file);
}

/* ---------- AUTH ---------- */
function login(){
  const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;
  const u=load(K.u,[]).find(x=>x.email===e&&x.pw===p);
  if(!u) return $('#msg').textContent='Email atau kata sandi salah.';
  save(K.s,u.id);go('home');
}
function register(){
  const v=k=>$('#'+k).value.trim();
  const em=v('em').toLowerCase(),pw=$('#pw').value,nm=v('nm'),ph=v('ph'),city=v('rc');
  const users=load(K.u,[]);
  if(!nm||!em||!ph) return $('#msg').textContent='Lengkapi semua data.';
  if(pw.length<6) return $('#msg').textContent='Kata sandi minimal 6 karakter.';
  if(users.some(x=>x.email===em)) return $('#msg').textContent='Email sudah terdaftar.';
  const u={id:uid(),role:v('role'),name:nm,email:em,pw,phone:ph,city,loc:CITIES[city]};
  users.push(u);save(K.u,users);save(K.s,u.id);go('home');
}
function logout(){localStorage.removeItem(K.s);go('home')}
const favs=()=>{const u=me();return u?(load(K.f,{})[u.id]||[]):[]};
function toggleFav(id){const u=me();if(!u)return go('login');const f=load(K.f,{});const l=f[u.id]||[];f[u.id]=l.includes(id)?l.filter(x=>x!==id):[...l,id];save(K.f,f);render()}
function markSold(id){const it=load(K.i,[]),x=it.find(i=>i.id===id);if(!x)return;x.sold=!x.sold;save(K.i,it);render()}
function delItem(id){if(!confirm('Hapus iklan ini?'))return;save(K.i,load(K.i,[]).filter(i=>i.id!==id));go('mine')}
function ownerBtns(i){return `<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm" onclick="go('sell','${i.id}')">✏️ Edit</button><button class="btn ghost sm" onclick="markSold('${i.id}')">${i.sold?'Batalkan Terjual':'✅ Tandai Terjual'}</button><button class="btn ghost sm" onclick="delItem('${i.id}')">🗑️ Hapus</button></div>`}

function vLogin(){
  return `<div class="card box"><h2>Masuk</h2>
  <label>Email</label><input id="em" type="email">
  <label>Kata sandi</label><input id="pw" type="password">
  <div id="msg" class="err"></div>
  <button class="btn" style="width:100%" onclick="login()">Masuk</button>
  <p class="muted">Demo penjual: demo@pasarkita.id / 123456</p>
  <p class="muted">Belum punya akun? <a onclick="go('register')" style="color:var(--o);cursor:pointer">Daftar</a></p></div>`;
}
function vRegister(){
  return `<div class="card box"><h2>Buat Akun</h2>
  <label>Daftar sebagai</label><select id="role"><option value="buyer">Pembeli - cari & tawar barang</option><option value="seller">Penjual - jual barang baru/bekas</option></select>
  <label>Nama lengkap</label><input id="nm">
  <label>Email</label><input id="em" type="email">
  <label>Kata sandi (min. 6 karakter)</label><input id="pw" type="password">
  <label>Nomor telepon (untuk fitur telpon)</label><input id="ph" type="tel" placeholder="08xxxxxxxxxx">
  <label>Wilayah tempat tinggal</label>${citySelect('rc','Banjarmasin')}
  <div id="msg" class="err"></div>
  <button class="btn" style="width:100%" onclick="register()">Daftar</button></div>`;
}

/* ---------- NAV ---------- */
function links(u){
  const a=(v,t)=>`<a class="${S.view===v?'on':''}" onclick="go('${v}')">${t}</a>`;
  return a('home','🏠 Beranda')+(u?a('fav','❤️ Favorit')+a('chats','💬 Chat'):'')+(u&&u.role==='seller'?a('sell','➕ Jual')+a('mine','📦 Iklan'):'')+(u?'':a('login','Masuk'));
}
function header(u){
  return `<header><div class="logo" onclick="go('home')">Pasar<span>Kita</span></div>
  <nav class="top">${links(u)}</nav><div class="grow"></div>
  ${u?`<span class="muted who">Halo, ${esc(u.name)} · <b style="color:var(--o)">${u.role==='seller'?'Penjual':'Pembeli'}</b></span>
  <button class="btn ghost sm" onclick="logout()">Keluar</button>`:`<button class="btn sm" onclick="go('register')">Daftar</button>`}
  </header>`;
}

/* ---------- HOME ---------- */
function card(i){
  return `<div class="card item" onclick="go('item','${i.id}')"><div class="pic">${pic(i)}</div>
  <div class="body"><span class="tag ${i.cond==='Baru'?'new':''}">${i.cond.toUpperCase()}</span><span class="tag">${i.cat}</span>${i.sold?'<span class="tag" style="background:#555">TERJUAL</span>':''}
  <div class="row" style="justify-content:space-between;align-items:flex-start"><div style="font-weight:600;margin:6px 0 4px">${esc(i.title)}</div><span style="cursor:pointer;font-size:18px" onclick="event.stopPropagation();toggleFav('${i.id}')">${favs().includes(i.id)?'❤️':'🤍'}</span></div>
  <div class="price">${rp(i.price)}</div>
  <div class="muted">📍 ${esc(i.city)}${i.d!=null?' · '+i.d.toFixed(1)+' km':''}</div></div></div>`;
}
function vHome(){
  const origin=S.loc||CITIES[S.city];
  const list=load(K.i,[])
    .filter(i=>(S.cat==='Semua'||i.cat===S.cat)&&(!S.cond||i.cond===S.cond)&&(!S.q||matchQ(i.title+' '+i.desc,S.q))&&(!S.pmin||i.price>=+S.pmin)&&(!S.pmax||i.price<=+S.pmax))
    .map(i=>({...i,d:dist(origin,i.loc)}))
    .filter(i=>!S.rad||i.d<=+S.rad);
  list.sort(S.sort==='dist'?(a,b)=>a.d-b.d:S.sort==='low'?(a,b)=>a.price-b.price:(a,b)=>b.ts-a.ts);
  const tiles=['Semua',...CATS].map(c=>`<div class="tile ${S.cat===c?'on':''}" onclick="S.cat='${c}';render()"><div class="ti">${c==='Semua'?'🛍️':EMO[c]}</div>${c}</div>`).join('');
  return `<div class="hero"><h1>Jual Beli <span>Baru & Bekas</span></h1>
  <p class="muted">Temukan barang terdekat dari lokasimu, lalu nego langsung lewat chat.</p>
  <div class="row" style="flex-wrap:wrap">
    <input id="q" placeholder="Cari barang..." value="${esc(S.q)}" style="flex:1;min-width:180px;margin:0" onchange="S.q=this.value;save('pk_lastq',S.q);render()">
    <button class="btn sm" onclick="useGPS()">📍 Lokasi saya</button>
    <select style="width:auto;margin:0" onchange="S.city=this.value;S.loc=null;render()">${Object.keys(CITIES).map(c=>`<option ${c===S.city&&!S.loc?'selected':''}>${c}</option>`).join('')}</select>
  </div>
  <p class="muted" style="margin:10px 0 0">${S.loc?'Diurutkan dari lokasi GPS kamu.':'Lokasi: '+S.city+' (tekan 📍 untuk lokasi akurat)'}</p></div>
  <div class="tiles">${tiles}</div>
  <div class="row" style="margin-bottom:16px;flex-wrap:wrap">
    <select style="width:auto;margin:0" onchange="S.cond=this.value;render()"><option value="">Baru & Bekas</option><option ${S.cond==='Baru'?'selected':''}>Baru</option><option ${S.cond==='Bekas'?'selected':''}>Bekas</option></select>
    <select style="width:auto;margin:0" onchange="S.sort=this.value;render()"><option value="dist" ${S.sort==='dist'?'selected':''}>Terdekat</option><option value="low" ${S.sort==='low'?'selected':''}>Harga terendah</option><option value="new" ${S.sort==='new'?'selected':''}>Terbaru</option></select>
    <select style="width:auto;margin:0" onchange="S.rad=this.value;render()"><option value="">Semua jarak</option>${[5,20,50].map(r=>`<option value="${r}" ${S.rad==r?'selected':''}>≤ ${r} km</option>`).join('')}</select>
    <input type="number" placeholder="Harga min" value="${S.pmin}" style="width:130px;margin:0" onchange="S.pmin=this.value;render()">
    <input type="number" placeholder="Harga max" value="${S.pmax}" style="width:130px;margin:0" onchange="S.pmax=this.value;render()">
    <span class="muted">${list.length} barang</span>
  </div>
  <div class="grid">${list.map(card).join('')||'<p class="muted">Belum ada barang. Penjual bisa mengunggah lewat menu Jual.</p>'}</div>`;
}
function useGPS(){
  if(!navigator.geolocation) return alert('Browser tidak mendukung lokasi.');
  navigator.geolocation.getCurrentPosition(p=>{S.loc=[p.coords.latitude,p.coords.longitude];S.sort='dist';render()},()=>alert('Izin lokasi ditolak. Pilih kota secara manual.'));
}

/* ---------- ITEM ---------- */
function vItem(u){
  const i=load(K.i,[]).find(x=>x.id===S.id);
  if(!i) return '<p>Barang tidak ditemukan.</p>';
  const s=load(K.u,[]).find(x=>x.id===i.sellerId)||{name:'-',phone:''};
  const isOwner=u&&u.id===i.sellerId;
  const action=!u?`<p class="muted"><a onclick="go('login')" style="color:var(--o);cursor:pointer">Masuk</a> untuk chat atau menelepon penjual.</p>`
    :isOwner?ownerBtns(i)
    :`<div class="row" style="margin-top:10px;flex-wrap:wrap">${i.sold?'<span class="tag">TERJUAL · chat dikunci</span>':`<button class="btn" onclick="startChat('${i.id}')">💬 Chat & nego</button>`}<button class="btn ghost" onclick="toggleFav('${i.id}')">${favs().includes(i.id)?'❤️ Disimpan':'🤍 Simpan'}</button><a class="btn ghost" href="tel:${esc(s.phone)}">📞 Telepon</a></div>`;
  return `<div class="layout"><div class="card">${gallery(i)}</div>
  <div><span class="tag ${i.cond==='Baru'?'new':''}">${i.cond}</span><span class="tag">${i.cat}</span>${i.sold?'<span class="tag" style="background:#555">TERJUAL</span>':''}
  <h2 style="margin:10px 0 4px">${esc(i.title)}</h2><div class="price" style="font-size:24px">${rp(i.price)}</div>
  <p class="muted">📍 ${esc(i.city)}${i.alamat?' - '+esc(i.alamat):''}</p>
  <p>${esc(i.desc).replace(/\n/g,'<br>')}</p>
  ${specHtml(i)}<div class="card" style="padding:14px;margin-top:16px"><b>${esc(s.name)}</b> <span class="muted">Penjual</span>${action}</div>
  </div></div>`;
}
function startChat(itemId){
  const u=me(); if(!u) return go('login');
  const i=load(K.i,[]).find(x=>x.id===itemId);
  if(!i||u.id===i.sellerId) return;
  const chats=load(K.c,[]);
  let c=chats.find(x=>x.itemId===itemId&&x.buyerId===u.id);
  if(!c){c={id:uid(),itemId,buyerId:u.id,sellerId:i.sellerId,msgs:[]};chats.push(c);save(K.c,chats)}
  go('chat',c.id);
}

/* ---------- CHAT ---------- */
function vChats(u){
  const chats=load(K.c,[]).filter(c=>c.buyerId===u.id||c.sellerId===u.id);
  const items=load(K.i,[]),users=load(K.u,[]);
  if(!chats.length) return '<p class="muted">Belum ada percakapan. Buka sebuah barang lalu tekan "Chat & nego".</p>';
  return '<h2>Chat</h2>'+chats.map(c=>{
    const it=items.find(x=>x.id===c.itemId)||{title:'(barang dihapus)'};
    const other=users.find(x=>x.id===(c.buyerId===u.id?c.sellerId:c.buyerId))||{name:'-'};
    const last=c.msgs[c.msgs.length-1];
    const preview=!last?'Mulai percakapan':last.type==='img'?'📷 Foto':last.type==='offer'?'💰 Tawaran '+rp(last.text):last.type==='call'?'📞 Panggilan telepon':last.type==='loc'?'📍 Lokasi':esc(last.text);
    return `<div class="card" style="padding:14px;margin-bottom:10px;cursor:pointer" onclick="go('chat','${c.id}')"><b>${esc(other.name)}</b> <span class="muted">· ${esc(it.title)}</span><div class="muted" style="margin-top:4px">${preview}</div></div>`;
  }).join('');
}
function bubble(m,u){
  const mine=m.from===u.id;
  let body;
  if(m.type==='img') body=`<img src="${m.img}" alt="foto">`;
  else if(m.type==='offer') body=`💰 Tawaran <b>${rp(m.text)}</b>`;
  else if(m.type==='call') body='📞 Panggilan telepon';
  else if(m.type==='loc') body=`📍 <a href="https://www.google.com/maps?q=${m.text}" target="_blank" rel="noopener" style="color:inherit">Buka lokasi di peta</a>`;
  else body=esc(m.text);
  return `<div class="bub ${mine?'me':''}">${body}<div class="muted" style="font-size:10px;margin-top:3px;text-align:right">${new Date(m.ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
}
function vChat(u){
  const c=load(K.c,[]).find(x=>x.id===S.id);
  if(!c) return '<p>Percakapan tidak ditemukan.</p>';
  const users=load(K.u,[]),items=load(K.i,[]);
  const it=items.find(x=>x.id===c.itemId)||{title:'-',price:0};
  const other=users.find(x=>x.id===(c.buyerId===u.id?c.sellerId:c.buyerId))||{name:'-',phone:'',role:''};
  return `<div class="card" style="padding:14px;margin-bottom:12px"><div class="row" style="justify-content:space-between;flex-wrap:wrap">
    <div><b>${esc(other.name)}</b> <span class="tag">${other.role==='seller'?'Penjual':'Pembeli'}</span><div class="muted">${esc(it.title)} · ${rp(it.price)}</div></div>
    <a class="btn sm" href="tel:${esc(other.phone)}" onclick="logCall('${c.id}')">📞 Telepon</a></div></div>
  ${it.sold?'<div class="card" style="padding:12px;margin-bottom:12px;border-color:var(--o)">🔒 Barang ini sudah terjual. Chat dikunci.</div>':''}<div class="card"><div class="msgs" id="msgs">${c.msgs.map(m=>bubble(m,u)).join('')||'<p class="muted" style="text-align:center">Mulai nego dengan sopan 👋</p>'}</div>
    <div style="padding:12px;border-top:1px solid var(--line)">
      <div class="row" style="flex-wrap:wrap;margin-bottom:8px">
        <button class="btn ghost sm" onclick="sendOffer('${c.id}')">💰 Tawar harga</button>
        <label class="btn ghost sm" style="cursor:pointer;color:var(--text)">📷 Kirim foto<input type="file" accept="image/*" hidden onchange="sendPhoto('${c.id}',this)"></label>
        <button class="btn ghost sm" onclick="quick('${c.id}','Masih tersedia?')">Masih tersedia?</button>
        <button class="btn ghost sm" onclick="quick('${c.id}','Bisa nego?')">Bisa nego?</button>
        <button class="btn ghost sm" onclick="quick('${c.id}','Setuju, deal ya!')">Setuju</button>
        <button class="btn ghost sm" onclick="sendLoc('${c.id}')">📍 Kirim lokasi</button>
      </div>
      <div class="row"><input id="txt" placeholder="Tulis pesan..." style="margin:0;flex:1" onkeydown="if(event.key==='Enter')sendText('${c.id}')"><button class="btn" onclick="sendText('${c.id}')">Kirim</button></div>
    </div></div>`;
}
function pushMsg(cid,m){
  const chats=load(K.c,[]),c=chats.find(x=>x.id===cid); if(!c) return; if((load(K.i,[]).find(x=>x.id===c.itemId)||{}).sold){alert('Barang sudah terjual, chat dikunci.');return}
  c.msgs.push({...m,from:me().id,ts:Date.now()});
  if(save(K.c,chats)) render();
}
function sendText(cid){const t=$('#txt').value.trim(); if(t) pushMsg(cid,{type:'text',text:t})}
function quick(cid,t){pushMsg(cid,{type:'text',text:t})}
function sendOffer(cid){
  const n=parseInt(String(prompt('Masukkan harga tawaranmu (Rp):')||'').replace(/\D/g,''),10);
  if(n>0) pushMsg(cid,{type:'offer',text:String(n)});
}
function logCall(cid){pushMsg(cid,{type:'call',text:''})}
function sendPhoto(cid,el){
  const f=el.files[0]; if(!f) return;
  shrink(f,720,img=>pushMsg(cid,{type:'img',img}));
}

/* ---------- SELL & MY ITEMS ---------- */
function vSell(u){
  const e=S.id?load(K.i,[]).find(x=>x.id===S.id):null;
  if(u.role!=='seller') return '<p class="muted">Fitur ini khusus akun penjual. Daftar sebagai penjual untuk mengunggah iklan.</p>';
  return `<div class="card wrap" style="padding:24px"><h2>${e?'Edit Iklan':'Unggah Iklan Baru'}</h2>
  <label>Judul barang</label><input id="t" value="${esc(e?e.title:'')}">
  <div class="layout" style="gap:12px"><div><label>Kategori</label><select id="cat" onchange="$('#specs').innerHTML=specInputs(this.value)">${CATS.map(c=>`<option ${e&&e.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div><label>Kondisi</label><select id="cd"><option ${e&&e.cond==='Baru'?'selected':''}>Baru</option><option ${e&&e.cond==='Bekas'?'selected':''}>Bekas</option></select></div></div>
  <div id="specs">${specInputs(e?e.cat:CATS[0],e)}</div>
  <label>Harga (Rp)</label><input id="pr" inputmode="numeric" value="${e?e.price:''}">
  <label>Wilayah (kota/kabupaten)</label>${citySelect('ct',e?e.city:u.city)}
  <label>Alamat / patokan lokasi</label><input id="al" placeholder="Contoh: Jl. A. Yani Km 4, dekat Mall ..." value="${esc(e?e.alamat:'')}">
  <label>Deskripsi</label><textarea id="ds" rows="4">${esc(e?e.desc:'')}</textarea>
  <label>Foto barang (maks. 5 foto)</label><input id="ph" type="file" accept="image/*" multiple>
  <div id="msg" class="err"></div>
  <button class="btn" style="width:100%" onclick="publishItem()">${e?'Simpan Perubahan':'Terbitkan Iklan'}</button></div>`;
}
function publishItem(){
  const g=k=>$('#'+k).value.trim(),u=me();
  if(!g('t')||!g('pr')) return $('#msg').textContent='Judul dan harga wajib diisi.';
  const city=g('ct');
  const finish=photo=>{
    const items=load(K.i,[]);
    const spec={};document.querySelectorAll('[data-spec]').forEach(x=>{if(x.value.trim())spec[x.dataset.spec]=x.value.trim()});
    const old=S.id?items.find(x=>x.id===S.id):null;
    const data={title:g('t'),cat:g('cat'),cond:g('cd'),price:+g('pr').replace(/\D/g,''),desc:g('ds'),alamat:g('al'),city,loc:CITIES[city],photos:photo.length?photo:(old?(old.photos||(old.photo?[old.photo]:[])):[]),spec};
    if(old) Object.assign(old,data); else items.push({id:uid(),sellerId:u.id,...data,sold:false,ts:Date.now()});
    if(save(K.i,items)) go('mine');
  };
  const fs=[...$('#ph').files].slice(0,5),out=[];
  const next=()=>{if(out.length<fs.length)shrink(fs[out.length],800,p=>{out.push(p);next()});else finish(out)};
  fs.length?next():finish([]);
}
function gallery(i){const ps=i.photos&&i.photos.length?i.photos:(i.photo?[i.photo]:[]);return ps.length?`<div style="display:flex;overflow-x:auto;scroll-snap-type:x mandatory">${ps.map(p=>`<img src="${p}" alt="" style="flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;display:block">`).join('')}</div>`:`<div class="ph" style="aspect-ratio:4/3">${EMO[i.cat]||'📦'}</div>`}
const SPECS={Otomotif:['Tahun','Kilometer','Transmisi'],Gadget:['Kapasitas','Kesehatan baterai','Kelengkapan'],Pakaian:['Ukuran','Bahan','Merek'],_:['Merek','Ukuran','Usia pakai']};
function specInputs(cat,e){return (SPECS[cat]||SPECS._).map(l=>`<label>${l}</label><input data-spec="${l}" value="${esc(e&&e.spec?e.spec[l]:'')}">`).join('')}
function specHtml(i){const x=Object.entries(i.spec||{});return x.length?`<table style="width:100%;font-size:14px;margin:10px 0;border-collapse:collapse">${x.map(([k,v])=>`<tr><td class="muted" style="padding:6px 0;width:45%">${esc(k)}</td><td style="padding:6px 0"><b>${esc(v)}</b></td></tr>`).join('')}</table>`:''}
function sendLoc(cid){if(!navigator.geolocation)return alert('Browser tidak mendukung lokasi.');navigator.geolocation.getCurrentPosition(p=>pushMsg(cid,{type:'loc',text:p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6)}),()=>alert('Izin lokasi ditolak.'))}
function lev(a,b){const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(b[i-1]===a[j-1]?0:1));return m[b.length][a.length]}
function matchQ(text,q){const t=text.toLowerCase();const words=t.split(/[^a-z0-9]+/).filter(Boolean);return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>t.includes(w)||words.some(x=>w.length>=4&&lev(w,x)<=1))}
function vFav(u){const ids=favs();const items=load(K.i,[]).filter(i=>ids.includes(i.id));return `<h2>Favorit Saya</h2><div class="grid">${items.map(card).join('')||'<p class="muted">Belum ada favorit. Tekan ❤️ pada barang yang kamu minati.</p>'}</div>`}
function vMine(u){
  const items=load(K.i,[]).filter(i=>i.sellerId===u.id);
  return `<h2>Iklan Saya</h2><div class="grid">${items.map(card).join('')||'<p class="muted">Belum ada iklan. Tekan menu Jual untuk mengunggah.</p>'}</div>`;
}

/* ---------- RENDER ---------- */
function render(){
  const u=me();
  const views={
    home:()=>vHome(),
    login:vLogin,
    register:vRegister,
    item:()=>vItem(u),
    fav:()=>u?vFav(u):vLogin(),
    chats:()=>u?vChats(u):vLogin(),
    chat:()=>u?vChat(u):vLogin(),
    sell:()=>u?vSell(u):vLogin(),
    mine:()=>u?vMine(u):vLogin()
  };
  const page=(views[S.view]||views.home)();
  $('#app').innerHTML=header(u)+`<main>${page}</main>`;
  $('#tabbar').innerHTML=links(u);
  const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight;
}
